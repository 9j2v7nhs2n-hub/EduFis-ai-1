<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFís AI - Painel do Professor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Gen AI SDK (Gemini) -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <!-- Configuração do Supabase -->
    <script>
        const SUPABASE_URL = 'https://fdawxgrheoukkuzzpfyr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fKYi1kPB6xuQBjR-pV4VQA_qQqJhqHW';

        let supabaseClient = null;

        try {
            if (typeof supabase !== 'undefined' && supabase.createClient) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error('Erro ao inicializar Supabase:', e);
        }
    </script>

    <!-- CONTAINER DE AUTENTICAÇÃO (LOGIN / CADASTRO) -->
    <div id="auth-container" class="min-h-screen flex flex-col justify-center items-center p-4 bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950">
        <div class="w-full max-w-md bg-slate-800/85 backdrop-blur-xl border border-slate-700/60 rounded-3xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-500/10 border border-brand-500/20 text-brand-400 text-3xl mb-4 shadow-inner">
                    <i class="fa-solid fa-dumbbell"></i>
                </div>
                <h1 id="auth-title" class="text-2xl font-extrabold tracking-tight text-white">EduFís <span class="text-brand-400">AI</span></h1>
                <p id="auth-subtitle" class="text-slate-400 text-sm mt-1">“Seu assistente inteligente de Educação Física.”</p>
            </div>

            <div id="form-feedback" class="hidden mb-4 p-3 rounded-xl text-xs text-center"></div>

            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">E-mail</label>
                    <input type="email" id="auth-email" required class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 text-sm" placeholder="professor@escola.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Senha</label>
                    <input type="password" id="auth-password" required class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 text-sm" placeholder="••••••••">
                </div>
                
                <div id="forgot-password-container" class="flex items-center justify-between text-xs pt-1">
                    <button type="button" onclick="handleForgotPassword()" class="text-brand-400 hover:underline font-medium">Esqueci minha senha</button>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3.5 px-4 bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold rounded-xl shadow-lg transition text-sm cursor-pointer">Entrar</button>
            </form>

            <div class="text-center mt-6 text-xs text-slate-400">
                <span id="toggle-text">Não tem uma conta?</span>
                <button type="button" onclick="toggleAuthMode()" id="toggle-btn" class="text-brand-400 hover:underline font-semibold ml-1">Criar minha conta</button>
            </div>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL (DASHBOARD COM SIDEBAR) -->
    <div id="dashboard-view" class="hidden min-h-screen flex bg-slate-950 w-full">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4 shrink-0">
            <div>
                <div class="flex items-center space-x-3 px-3 py-4 mb-6 border-b border-slate-800">
                    <div class="w-10 h-10 rounded-xl bg-brand-500/10 border border-brand-500/20 flex items-center justify-center text-brand-400">
                        <i class="fa-solid fa-dumbbell"></i>
                    </div>
                    <div>
                        <span class="font-extrabold text-white text-lg">EduFís <span class="text-brand-400">AI</span></span>
                        <p class="text-[10px] text-slate-400 uppercase tracking-wider">Painel do Professor</p>
                    </div>
                </div>

                <nav class="space-y-1.5">
                    <button onclick="switchTab('inicio')" id="nav-inicio" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition bg-brand-500/10 text-brand-400 border border-brand-500/20 cursor-pointer">
                        <i class="fa-solid fa-house w-5"></i><span>Início</span>
                    </button>
                    <button onclick="switchTab('turmas')" id="nav-turmas" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-slate-400 hover:bg-slate-800 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-users-rectangle w-5"></i><span>Turmas</span>
                    </button>
                    <button onclick="switchTab('alunos')" id="nav-alunos" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-slate-400 hover:bg-slate-800 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-graduation-cap w-5"></i><span>Alunos</span>
                    </button>
                    <button onclick="switchTab('ia')" id="nav-ia" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-slate-400 hover:bg-slate-800 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-robot w-5 text-brand-400"></i><span>Assistente IA</span>
                    </button>
                    <button onclick="switchTab('configuracoes')" id="nav-configuracoes" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-slate-400 hover:bg-slate-800 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-gear w-5"></i><span>Configurações</span>
                    </button>
                </nav>
            </div>

            <div class="pt-4 border-t border-slate-800">
                <button onclick="handleLogout()" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold text-red-400 hover:bg-red-500/10 transition border border-transparent hover:border-red-500/20 cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket w-5"></i><span>Sair da Conta</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-8 overflow-y-auto max-h-screen">
            
            <!-- ABA: INÍCIO -->
            <section id="tab-inicio" class="tab-content space-y-6">
                <div class="bg-gradient-to-r from-slate-900 to-emerald-950/40 border border-slate-800 p-6 rounded-3xl shadow-xl flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-extrabold text-white">Olá, Professor! 👋</h2>
                        <p class="text-slate-400 text-sm mt-1">Gerencie suas turmas, alunos e crie planos de aula inteligentes com IA.</p>
                    </div>
                    <button onclick="switchTab('ia')" class="px-5 py-3 bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold rounded-2xl shadow-lg transition text-sm flex items-center space-x-2 cursor-pointer">
                        <i class="fa-solid fa-wand-magic-sparkles"></i><span>Criar com IA</span>
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-slate-900/60 border border-slate-800 p-6 rounded-3xl shadow-lg">
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Turmas Cadastradas</span>
                            <div class="w-10 h-10 rounded-xl bg-brand-500/10 border border-brand-500/20 flex items-center justify-center text-brand-400">
                                <i class="fa-solid fa-users"></i>
                            </div>
                        </div>
                        <h3 id="stat-turmas" class="text-3xl font-extrabold text-white">0</h3>
                    </div>
                    <div class="bg-slate-900/60
